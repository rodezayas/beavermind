[project]
name = "harness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "fpdf2>=2.8.8",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "pydantic>=2.13.4",
    "streamlit>=1.62.0",
    "supabase>=2.31.0",
]


[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
